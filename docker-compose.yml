services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080 --project=demo-project
    ports:
      - "8080:8080"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8080"
    environment:
      GOOGLE_CLOUD_PROJECT: demo-project
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      QUOTE_CACHE_TTL_MINUTES: 15
    depends_on:
      - firestore-emulator

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
